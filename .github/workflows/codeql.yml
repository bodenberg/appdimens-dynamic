name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '20 14 * * 5'

# Least privilege: the analyze job needs to read the repo, read packages and
# write security events (SARIF upload). Nothing else is touched.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true

      # Manual build mode on purpose. CodeQL's autobuild runs `./gradlew clean
      # assemble`, which minifies every release variant — all 13 library
      # modules plus the app and benchlab run R8 concurrently in the Gradle
      # daemon and exhaust the runner heap (OutOfMemoryError). Debug variants
      # skip R8, so building them is enough for CodeQL to extract the
      # Java/Kotlin sources while staying well within memory limits.
      - name: Build with Gradle (debug variants, no R8)
        run: ./gradlew --no-daemon assembleDebug

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"

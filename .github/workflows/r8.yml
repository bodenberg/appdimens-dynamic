name: R8 Full-Mode Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  # Keep in sync with gradle.properties — GRADLE_OPTS overrides it.
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx8g"

jobs:
  release-build:
    name: Release + R8 full mode + shrink check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # R8 full mode is the default on AGP 8+; the app demo already ships the
      # most aggressive consumer scenario (minify + shrinkResources + broad
      # optimizations). This builds the exact artifact a customer would ship.
      - name: Build release (minify + R8 full mode)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Check R8 shrink budget (must-keep API survives)
        run: |
          chmod +x scripts/check-r8-usage.sh
          bash scripts/check-r8-usage.sh \
            app/build/outputs/mapping/release/usage.txt \
            scripts/r8-must-keep.txt

      - name: Upload mapping (debugging consumers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-release
          path: |
            app/build/outputs/mapping/release/*.txt
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests on minified APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release + androidTest APKs
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest --stacktrace

      # The emulator needs KVM. Some hosted fleets run without it; in that
      # case the x86_64 image falls back to TCG (-accel off) and never finishes
      # booting ("adb: device offline" until the timeout). Detect it up front:
      # with KVM the tests run (generous boot timeout for slow fleets); without
      # it the step is skipped with a warning — the release-build job already
      # guards the minified API surface via the R8 usage/shrink check.
      - name: Detect KVM support
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run instrumented tests on the minified release APK
        if: steps.kvm.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          boot-timeout: 1200000
          script: ./gradlew :app:connectedReleaseAndroidTest --stacktrace

      - name: Skip instrumented tests (no KVM on runner)
        if: steps.kvm.outputs.available != 'true'
        run: echo "::warning::KVM unavailable on this runner; instrumented tests were skipped. The R8 shrink check still validates the minified API surface."
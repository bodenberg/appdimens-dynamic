name: R8 Full-Mode Compliance

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  release-build:
    name: Release + R8 full mode + shrink check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      # R8 full mode is the default on AGP 8+; the app demo already ships the
      # most aggressive consumer scenario (minify + shrinkResources + broad
      # optimizations). This builds the exact artifact a customer would ship.
      - name: Build release (minify + R8 full mode)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace

      - name: Check R8 shrink budget (must-keep API survives)
        run: |
          chmod +x scripts/check-r8-usage.sh
          bash scripts/check-r8-usage.sh \
            app/build/outputs/mapping/release/usage.txt \
            scripts/r8-must-keep.txt

      - name: Upload mapping (debugging consumers)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-release
          path: |
            app/build/outputs/mapping/release/*.txt
          if-no-files-found: ignore

  instrumented:
    name: Instrumented tests on minified APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release + androidTest APKs
        run: ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest --stacktrace

      - name: Run instrumented tests on the minified release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedReleaseAndroidTest --stacktrace
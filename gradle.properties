# AppDimens library version — all published artifacts share this.
appdimens.version=3.1.6

# Memory and JVM
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Parallel and Cache (Velocidade de Build)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Android and Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
android.buildFeatures.compose=true
kotlin.code.style=official

# R8
# android.enableR8.fullMode=true

# cmake.dir=/home/bodenberg/Android/Sdk/cmake/4.1.1

# ENABLE PUBLISH MAVEN REPOSITORY
# org.gradle.java.home=/app/extra/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

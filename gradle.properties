# AppDimens library version — all published artifacts share this.
appdimens.version=3.2.0

# Memory and JVM
# -Xmx8g: a full `assemble` runs R8 (minifyReleaseWithR8) for every release
# variant — all 13 library modules plus the app and benchlab apps — and AGP
# runs those R8 passes in-process inside the Gradle daemon. 4g was enough for
# single-module builds but exhausts the heap on the full multi-module assemble
# (OutOfMemoryError during CodeQL autobuild's `clean assemble`). 8g fits the
# 16 GB ubuntu-latest runner alongside the Kotlin daemon and aapt2.
org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# R8 runs in the daemon and each concurrent minify pass can peak at ~1.5-2 GB,
# so 13+ parallel R8 passes would exhaust even an 8g heap on machines with many
# cores. Cap workers to keep the full `assemble` deterministic on CI and local.
org.gradle.workers.max=4

# Parallel and Cache (Velocidade de Build)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false

# Android and Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true
android.buildFeatures.compose=true
kotlin.code.style=official

# R8
# AGP 9+ runs R8 in full mode ALWAYS: this property is a legacy no-op kept only
# as documentation. Consumer-rules.pro files and test fixtures rely on full-mode
# semantics (shrinking + renaming), which cannot be switched off on AGP 9.
android.enableR8.fullMode=true

# cmake.dir=/home/bodenberg/Android/Sdk/cmake/4.1.1

# ENABLE PUBLISH MAVEN REPOSITORY
